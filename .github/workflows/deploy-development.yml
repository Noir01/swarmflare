name: Deploy Swarmflare development

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarmflare-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Swarmflare deployment
        run: npm run check:swarmflare
      - name: Deploy existing Purdue Worker
        run: npm run deploy:swarmflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cb50a73b7487ae7039cbc8b613986b8b
